[alembic]
script_location = alembic

# Where to find the app's modules. Two entries because the layout differs:
#   locally  -> repo root, models live in ./app
#   in image -> WORKDIR /app, models are flat alongside alembic.ini (".")
# Alembic tries each, so `from models import ...` resolves in both places.
prepend_sys_path = . app

# Timestamped migration filenames sort chronologically, which a bare hash does not.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Deliberately blank. The URL is read from DATABASE_URL via app/config.py inside
# alembic/env.py. Putting a real URL here would mean committing credentials, and
# would also break on passwords containing '%' (configparser treats it specially).
sqlalchemy.url =


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
