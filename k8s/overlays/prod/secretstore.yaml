# Tells the External Secrets Operator WHICH AWS account/service to read, and WHO
# to authenticate as. Namespaced (a SecretStore, not a ClusterSecretStore) — so
# each environment authenticates with its own IRSA role and can only reach its own
# secrets.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: prod
spec:
  provider:
    aws:
      service: SecretsManager
      region: <REGION>
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-prod # the annotated SA in this namespace