# The IRSA identity the External Secrets Operator uses to read Secrets Manager.
#
# This annotation is the whole mechanism. EKS's admission webhook sees it and
# injects, into every pod using this ServiceAccount:
#   - a short-lived JWT signed by the cluster, at
#     /var/run/secrets/eks.amazonaws.com/serviceaccount/token
#   - the env vars AWS_ROLE_ARN and AWS_WEB_IDENTITY_TOKEN_FILE
#
# The AWS SDK finds those on its own and calls sts:AssumeRoleWithWebIdentity.
# STS verifies the JWT against the cluster's OIDC provider, checks the role's trust
# policy, and hands back temporary credentials. No AWS access key exists anywhere.
#
# The role's trust policy must pin the sub claim to THIS service account:
#   "oidc.eks.<region>.amazonaws.com/id/<id>:sub":
#       "system:serviceaccount:prod:external-secrets-prod"
#
# ...and its permission policy should be scoped to this environment's secrets only:
#   "Action":   "secretsmanager:GetSecretValue"
#   "Resource": "arn:aws:secretsmanager:<region>:<account>:secret:prod/*"
#
# That is the point of a separate SA + role per namespace: a pod in `prod` cannot
# read the prod credential. Not "shouldn't" — CAN'T.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-prod
  namespace: prod
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::<ACCOUNT_ID>:role/eso-realtime-app-prod