# The per-environment file. This — and only this — is what differs between dev,
# uat and prod as far as the database is concerned.
#
#   remoteRef.key  = the NAME of the secret in AWS Secrets Manager   (varies per env)
#   remoteRef.property = a FIELD inside that secret's JSON value
#   target.name    = the name of the Kubernetes Secret it creates    (ALWAYS the same)
#
# Because target.name is constant, base/deployment.yaml's `envFrom` needs no patch
# in any environment. The environment is a property of the Secret's CONTENTS, not
# of the app's manifests.
#
# Slash-delimited AWS names (dev/... uat/... prod/...) are deliberate: IAM Resource
# matching is prefix-based, so a policy can scope cleanly to `secret:uat/*`.
#
# Create the AWS secret with:
#   aws secretsmanager create-secret --name uat/realtime-app/db --secret-string \
#     '{"host":"...","port":"5432","username":"appuser","password":"...","dbname":"realtime"}'
#
# Better still, let RDS own it: `aws rds create-db-instance --manage-master-user-password`
# generates, stores and ROTATES the password in Secrets Manager, in exactly this
# JSON shape. You never see the password at all.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgres-credentials
  namespace: uat
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    # ⚠️ Env vars are frozen when a container starts. When the password rotates and
    # ESO refreshes this Secret, RUNNING PODS KEEP THE OLD VALUE and fail on their
    # next reconnect — a confusing 3am failure. Either `kubectl rollout restart
    # deployment/realtime-app` after a rotation, or install Reloader to watch this
    # Secret and roll the Deployment automatically.
    name: postgres-credentials
    creationPolicy: Owner
  data:
    - secretKey: DB_HOST
      remoteRef:
        key: uat/realtime-app/db
        property: host
    - secretKey: DB_PORT
      remoteRef:
        key: uat/realtime-app/db
        property: port
    - secretKey: DB_USER
      remoteRef:
        key: uat/realtime-app/db
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: uat/realtime-app/db
        property: password
    - secretKey: DB_NAME
      remoteRef:
        key: uat/realtime-app/db
        property: dbname