### As we are passing postgres credentials form this file we are keeping it.
### Otherwise if we use kubectl create secret command to create secret then we do not need this file.
### Need to remove this file from the kustomization.yaml resources as well.

# Postgres for LOCAL Kubernetes only.
#
# There is no equivalent of this file in the dev/uat/prod overlays — on AWS the
# database is RDS. Running a production database as a pod means owning backups,
# failover, patching and storage; RDS exists so you don't.
#
# The point of running it here is that the WIRING is identical either way:
# Secret -> envFrom -> the app. The app never learns the difference.
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials # <-- the same name the base Deployment's envFrom expects.
  # On AWS, a Secret with this same name is created by the External Secrets
  # Operator from AWS Secrets Manager. Same name, same five keys, different source.
  # That is why base/deployment.yaml needs no per-environment patch.
type: Opaque
# stringData takes plain text; Kubernetes base64-encodes it.
#
# base64 is ENCODING, NOT ENCRYPTION — anyone with read access to the namespace
# can decode it. These are throwaway local credentials and this file is committed
# on purpose so the local setup is reproducible. Nothing like this exists in the
# AWS overlays: there, the Secret is never a file and never committed.
stringData:
  DB_HOST: host.docker.internal # the Service name below. On AWS: the RDS endpoint.
  DB_PORT: "5432"
  DB_USER: postgres
  DB_PASSWORD: password1
  DB_NAME: realtimeapp
---
### This is all required only if postgres runs on a pod

