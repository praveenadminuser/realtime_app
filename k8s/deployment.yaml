apiVersion: apps/v1
kind: Deployment # desired state
metadata:
  name: realtime-app
spec:
  replicas: 1 # how many identical pods to keep running
  # Which pods this Deployment manages — must match the pod template's labels.
  selector:
    matchLabels:
      app: realtime-app
  template:
    metadata:
      labels:
        app: realtime-app
    spec:
      containers:
        - name: realtime-app
          image: realtime-app:0.1.0
          # Use the image already in the local Docker daemon; don't try to pull
          # it from a registry (there isn't one yet). Change this for EKS.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
