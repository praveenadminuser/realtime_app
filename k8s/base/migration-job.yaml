# Runs `alembic upgrade head` once, then exits.
#
#   kubectl delete job db-migrate -n <ns> --ignore-not-found   # Jobs are immutable
#   kubectl apply -k k8s/overlays/<env>
#   kubectl logs job/db-migrate -n <ns>
#
# Why a Job and not an initContainer on the app Deployment: an initContainer runs
# on EVERY pod, so scaling to 3 replicas means three concurrent `alembic upgrade`
# runs racing each other. A Job runs exactly once. (Alembic does take a lock, so
# the race is survivable — but "survivable" is a poor foundation for schema changes.)
#
# It reads the SAME Secret and the SAME ConfigMap as the app, and runs the SAME
# image tag. That is deliberate: the schema and the code that assumes it ship as
# one artifact and cannot drift apart.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
spec:
  # Give up rather than hammer a database that is rejecting us.
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: alembic
          # Placeholder — rewritten per overlay, exactly like the Deployment's.
          image: realtime_application-api:latest
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - secretRef:
                name: postgres-credentials
            - configMapRef:
                name: app-config
