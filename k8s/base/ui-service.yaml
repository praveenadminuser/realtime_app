apiVersion: v1
kind: Service
metadata:
  name: realtime-ui
spec:
  # LoadBalancer: this is the PUBLIC front door now. Users hit the UI, and the UI's
  # nginx proxies /api to the backend internally. So the backend Service no longer
  # needs to be internet-facing — on EKS you could downgrade realtime-app to ClusterIP
  # and expose only this. (Left as-is for now; see the note in EKS.md.)
  type: LoadBalancer
  selector:
    app: realtime-ui
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
