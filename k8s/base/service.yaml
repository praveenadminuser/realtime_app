apiVersion: v1
kind: Service
metadata:
  name: realtime-app
spec:
  # LoadBalancer = reachable from outside the cluster.
  # On Docker Desktop this binds to localhost. On EKS it provisions a real AWS ELB.
  # Identical in every overlay — this is the one file that genuinely never varies.
  type: LoadBalancer
  # Send traffic to every pod carrying this label — the same label the
  # Deployment stamps onto its pods.
  selector:
    app: realtime-app
  ports:
    - name: http
      # Port the load balancer listens on (what clients call).
      port: 8080
      # Port on the pod/container to forward to (uvicorn listens here).
      targetPort: 8000
      protocol: TCP