# Local development: app + Postgres, one command.
#
#   docker compose up --build -d
#   docker compose run --rm api alembic upgrade head    # create the schema
#   curl http://localhost:8000/health/ready
#
# This file never ships to AWS. On EKS the "db" service is replaced by RDS, and the
# only thing that changes is DB_HOST (+ DB_SSL=true).
#
# ---------------------------------------------------------------------------
# Already have Postgres installed on Windows and don't want this container?
# See the commented "api" block at the bottom — you delete the "db" service and
# point DB_HOST at host.docker.internal. No app code changes either way.
# ---------------------------------------------------------------------------

services:
  # db:
  #   image: postgres:16-alpine
  #   environment:
  #     # The postgres image uses POSTGRES_*; our app uses DB_*. Same values, and
  #     # they must agree — these are what initdb creates on first boot.
  #     POSTGRES_USER: realtime
  #     POSTGRES_PASSWORD: realtime      # local-only throwaway credential
  #     POSTGRES_DB: realtime
  #   ports:
  #     - "5432:5432"                    # exposed so you can attach psql/DBeaver from Windows
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data
  #   healthcheck:
  #     # Postgres briefly accepts connections while still initialising, so a port
  #     # check is not enough — pg_isready is the honest signal.
  #     test: ["CMD-SHELL", "pg_isready -U realtime -d realtime"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 10

  # api:
  #   build: .
  #   environment:
  #     # DB_HOST is "db" — the compose service name, resolved by compose's internal
  #     # DNS. Exactly the same idea as a Kubernetes Service name, which is why this
  #     # transfers unchanged. NOT "localhost": inside the api container, localhost
  #     # is the api container.
  #     DB_HOST: db
  #     DB_PORT: "5432"
  #     DB_USER: realtime
  #     DB_PASSWORD: realtime
  #     DB_NAME: realtime
  #     DB_SSL: "false" # a local container speaks plaintext
  #     DB_ECHO: "true" # print SQL locally; left off in the cluster
  #   ports:
  #     - "8000:8000"
  #   depends_on:
  #     db:
  #       condition: service_healthy # wait for the healthcheck, not just for the container to exist

  # --- Variant: Postgres already installed on your Windows machine -------------
  # Delete the "db" service above (and the volumes: block), then use this instead.
  #
  api:
    build: .
    # image: realtime-app:0.3.0 # With this we can mention the tag name
    # environment:
    #   # host.docker.internal resolves to the Windows host FROM INSIDE the container.
    #   # "localhost" would be the container itself — the #1 Docker networking mistake.
    #   # (Docker Desktop only; plain Linux Docker needs the host-gateway IP.)
    #   DB_HOST: host.docker.internal
    #   DB_PORT: "5432"
    #   DB_USER: postgres
    #   DB_PASSWORD: password1
    #   DB_NAME: realtimeapp
    #   DB_SSL: "false"
    # Which env file to load. Defaults to .env.dev — DELIBERATELY the safe one.
    # A default of .env.prod would mean a fresh clone running `docker compose up`
    # points at the production database, and a stray `down -v` or `alembic upgrade`
    # would then hit real data. Reaching anything but dev must be an explicit act:
    #
    #   docker compose up -d --build                              # dev (default)
    #
    # UAT — deliberate, and the syntax differs per shell:
    #   ENV_FILE=.env.uat docker compose up -d --build            # Git Bash / POSIX
    #   $env:ENV_FILE=".env.uat"; docker compose up -d --build    # PowerShell
    #   set ENV_FILE=.env.uat && docker compose up -d --build     # cmd.exe
    #
    # In Git Bash the variable is a PREFIX — no `set`, no `&&`. `set ENV_FILE=...`
    # is cmd.exe syntax; bash's `set` builtin does something else entirely and will
    # NOT define the variable, so compose silently falls back to .env.dev.
    #
    # Switching this way edits no tracked file — so `env_file: .env.prod` can never
    # be committed by accident.
    #
    # There is no .env.prod, on purpose. Production credentials do not live in a file
    # on a laptop: prod reads a Kubernetes Secret sourced from AWS Secrets Manager,
    # which is what the `envFrom` in k8s/deployment.yaml is already wired to.
    env_file: ${ENV_FILE:-.env.dev}
    ports:
      - "8000:8000"

  # --- The React UI, as nginx serving the built bundle -------------------------
  #
  #   docker compose up -d --build      then open http://localhost:8080
  #
  # This runs the SAME production image that Kubernetes runs. The only difference is
  # API_UPSTREAM below — nginx reads it at container start (see ui/nginx.conf.template),
  # so one image works in both places without a rebuild.
  #
  # For day-to-day UI work prefer `cd ui && npm run dev` (port 5173): hot reload, no
  # image rebuild per edit. This service is for exercising the real artifact.
  ui:
    build: ./ui
    environment:
      # "api" is the compose service name above, on port 8000 — the container's own
      # port, since compose has no Service doing the 8080->8000 mapping Kubernetes does.
      # In the cluster this becomes http://realtime-app:8080. NOT localhost: inside the
      # ui container, localhost is the ui container.
      API_UPSTREAM: http://api:8000
    ports:
      # 8080 on the host -> 80 in the container (nginx). The browser calls
      # localhost:8080/api/users, nginx strips /api and forwards to api:8000/users.
      - "8080:80"
    depends_on:
      - api
  #
  # Two things your local Postgres needs for this to work:
  #   postgresql.conf  listen_addresses = '*'      (not just 127.0.0.1)
  #   pg_hba.conf      allow the Docker bridge subnet
  # A connection that HANGS rather than refuses is almost always pg_hba.conf.
  # ---------------------------------------------------------------------------

# volumes:
#   pgdata: # named volume: data survives `docker compose down`
#     # (use `down -v` to wipe it and start clean)
